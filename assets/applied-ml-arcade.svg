<svg xmlns="http://www.w3.org/2000/svg" width="920" height="288" viewBox="0 0 920 288" role="img" aria-labelledby="title descr">
<title id="title">Applied ML Arcade</title>
<desc id="descr">Three possible routes from a business question to a measured outcome: experiment, predictive model, or AI workflow.</desc>
<style>
  .mono{font-family:"DejaVu Sans Mono",monospace}
  .track{fill:none;stroke:#304651;stroke-width:2;shape-rendering:crispEdges}
  .dot{shape-rendering:crispEdges}
  .in,.out{animation:packet 2.4s steps(19,end) 1 both}
  .in.b{animation-delay:.55s}.in.c{animation-delay:1.1s}
  .out.a{animation-delay:1.2s}.out.b{animation-delay:1.75s}.out.c{animation-delay:2.3s}
  @keyframes packet{0%{transform:translateX(-24px);opacity:0}12%{opacity:1}75%{transform:translateX(31px);opacity:1}100%{transform:translateX(0);opacity:.8}}
  @media(prefers-reduced-motion:reduce){.dot path{animation:none}}
</style>
<rect width="920" height="288" rx="18" fill="#0b151f"/>
<rect x="12" y="12" width="896" height="264" rx="10" fill="none" stroke="#29414b" stroke-width="2"/>
<g fill="#94b8c0" class="mono" font-size="12" letter-spacing="3">
  <text x="36" y="45">D. GORLOV / WORKBENCH</text><text x="884" y="45" text-anchor="end">01 : FIELD NOTES</text>
</g>
<path d="M36 56H884" stroke="#263c47"/>
<text class="mono" font-size="30" font-weight="bold" x="36" y="96" fill="#f0fbf9">APPLIED ML ARCADE</text>
<path class="track" d="M228 184h34v-48h78m-112 48h112m-78 0v48h78m240-96h78v48h34m-112 0h112m-112 48h78v-48"/>
<g class="mono" font-size="16" text-anchor="middle">
  <rect x="36" y="153" width="192" height="62" fill="#123132" stroke="#427c74"/>
  <text x="132" y="179" fill="#a5ffdc">BUSINESS</text><text x="132" y="200" fill="#e9fcf8">QUESTION</text>
  <rect x="340" y="119" width="240" height="34" fill="#152938" stroke="#34516a"/>
  <rect x="340" y="167" width="240" height="34" fill="#152938" stroke="#34516a"/>
  <rect x="340" y="215" width="240" height="34" fill="#152938" stroke="#34516a"/>
  <text x="460" y="142" fill="#b9e6ff">EXPERIMENT</text>
  <text x="460" y="190" fill="#c6c2ff">PREDICTIVE MODEL</text>
  <text x="460" y="238" fill="#a5ffdc">AI WORKFLOW</text>
  <rect x="692" y="153" width="192" height="62" fill="#33291c" stroke="#8a6b3d"/>
  <text x="788" y="179" fill="#ffdb92">MEASURE</text><text x="788" y="200" fill="#fff5db">WHAT CHANGES</text>
</g>
<g class="dot">
  <path class="in a" fill="#89d8ff" d="M285 132h8v8h-8z"/><path class="out a" fill="#89d8ff" d="M629 132h8v8h-8z"/>
  <path class="in b" fill="#bcabff" d="M285 180h8v8h-8z"/><path class="out b" fill="#bcabff" d="M629 180h8v8h-8z"/>
  <path class="in c" fill="#91ffcf" d="M285 228h8v8h-8z"/><path class="out c" fill="#91ffcf" d="M629 228h8v8h-8z"/>
</g>
</svg>
